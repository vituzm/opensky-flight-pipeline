# https://docs.confluent.io/platform/current/installation/docker/config-reference.html#ak-configuration
# https://docs.confluent.io/platform/current/installation/docker/image-reference.html

services:
  kafka-1:
    image: confluentinc/cp-server:7.6.0 # CP-Server for the confluent broker metrics
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Each file will have at most 10MB
        max-file: "3"    # Only the last 3 files will be kept (total 30MB)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    environment:
      KAFKA_BROKER_RACK: "rack-1"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller' # Broker and controller roles
      # Internal communication protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # If the controller goes down the other brokers will elect a new controller from the remaining brokers.
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093' 
      # PLAINTEXT internal communication between brokers
      # PLAINTEXT_HOST external consumers
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      # If any service asks the broker address, he must use the PLAINTEXT_HOST
      # For dev it is used as plain text
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # Default value for the number of partition to create when a topic is created without specifying the number of partitions.
      KAFKA_NUM_PARTITIONS: 3 # https://docs.confluent.io/platform/current/installation/configuration/broker-configs.html#num-partitions
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # Quantity of replicas for the partitions in this broker
      KAFKA_MIN_INSYNC_REPLICAS: 2 # Minimum number of replicas that must acknowledge a write for the write to be considered successful.
      
      # __consumer_offsets: internal kafka topic that stores consumer group read offsets.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 2 # Default is 50
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Minimum number of replicas that must acknowledge a transaction before it is considered successful.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # 1 is the minum number 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 #Number of replicas for the transaction state log topic.

      KAFKA_LOG4J_ROOT_LOGGER_LEVEL: 'WARN'
      CLUSTER_ID: 'TUnQLj3xQsyJWR4FBjoLHQ'

      # Confluent metrics reporter configuration https://docs.confluent.io/platform/7.6/kafka/metrics-reporter.html
      # KAFKA_METRIC_REPORTERS: "io.confluent.metrics.reporter.ConfluentMetricsReporter"
      # KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      # KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_RETENTION_MS: 600000

      

  kafka-2:
