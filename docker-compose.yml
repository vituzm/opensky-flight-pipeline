      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG4J_ROOT_LOGGER_LEVEL: 'WARN'
      CLUSTER_ID: 'TUnQLj3xQsyJWR4FBjoLHQ'
      # KAFKA_METRIC_REPORTERS: "io.confluent.metrics.reporter.ConfluentMetricsReporter"
      # KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      # KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_RETENTION_MS: 600000

  schema-registry: # Future use for Avro or Protobuf schema validation.
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-1:29092,kafka-2:29092,kafka-3:29092'
      # SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081 # For connection with the control-center
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: 'WARN'

